on:
  push:
    branches: [ "dev4wiki" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Docker Buildx (支持多架构构建，如 amd64, arm64)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: registry.cn-wulanchabu.aliyuncs.com/synjones2021 # 如果不是 Docker Hub 请取消注释并修改
          username: ${{ secrets.ALIYUN_ACR_USERNAM }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # 4. 构建并推送
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 修改为 你的用户名/项目名:版本号
          tags: |
            open-webui:latest
            open-webui:${{ github.sha }}
